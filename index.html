<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스윙콕핏 — 추천 종목</title>
<meta name="description" content="스윙콕핏 오늘의 추천 종목">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6b5f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="card.css?v=5">
<style>
  :root{
    --bg:#f5f2ec; --surface:#ffffff; --surface-2:#eeeadf;
    --border:#e2ddd0; --ink:#1c1d19; --ink-muted:#6c6a5f; --ink-faint:#9c9a8d;
    --accent:#0d6b5f; --accent-ink:#ffffff; --accent-soft:#e3efec;
    --up:#c8382c; --up-soft:#f7e4e1; --down:#2a5fc4; --down-soft:#e2eaf9;
    --warn:#a9700f; --warn-soft:#f4e8d2; --shadow: 0 1px 2px rgba(28,29,25,.06), 0 6px 20px -8px rgba(28,29,25,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a; --surface:#1b201f; --surface-2:#212724;
      --border:#2b322d; --ink:#e9e6dd; --ink-muted:#a4a294; --ink-faint:#726f63;
      --accent:#3fcdb8; --accent-ink:#0c1615; --accent-soft:#1c2f2b;
      --up:#ec6b5e; --up-soft:#3a2220; --down:#7fa8f2; --down-soft:#1f2a3d;
      --warn:#e3ad55; --warn-soft:#3a2f18; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a; --surface:#1b201f; --surface-2:#212724;
    --border:#2b322d; --ink:#e9e6dd; --ink-muted:#a4a294; --ink-faint:#726f63;
    --accent:#3fcdb8; --accent-ink:#0c1615; --accent-soft:#1c2f2b;
    --up:#ec6b5e; --up-soft:#3a2220; --down:#7fa8f2; --down-soft:#1f2a3d;
    --warn:#e3ad55; --warn-soft:#3a2f18; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
    padding-inline:16px; max-width:720px; margin-inline:auto;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  h1,h2{ text-wrap:balance; margin:0; }

  header.top{
    position:sticky; top:env(safe-area-inset-top, 0px);
    background:var(--bg); padding-block:18px 10px; z-index:5;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .brand h1{ font-size:19px; font-weight:700; letter-spacing:-.01em; }
  .brand .asof{ font-size:11px; color:var(--ink-faint); }
  .sub{ font-size:12px; color:var(--ink-muted); margin-top:6px; }

  .summary{
    margin-top:12px; display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:12px; overflow:hidden;
  }
  .summary .cell{ background:var(--surface); padding:10px 12px; }
  .summary .label{ font-size:11px; color:var(--ink-muted); margin-bottom:4px; }
  .summary .value{ font-size:16px; font-weight:600; }
  .summary .value.up{ color:var(--up); } .summary .value.down{ color:var(--down); }

  section{ margin-top:22px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .section-head h2{ font-size:15px; font-weight:600; }
  .section-head .note{ font-size:11px; color:var(--ink-faint); }

  .empty{ padding:22px 14px; text-align:center; color:var(--ink-faint); font-size:12.5px;
    background:var(--surface); border:1px dashed var(--border); border-radius:12px; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:auto; box-shadow:var(--shadow); }
  th,td{ padding:9px 11px; text-align:right; white-space:nowrap; }
  th:first-child,td:first-child{ text-align:left; }
  thead th{ font-size:10.5px; color:var(--ink-muted); font-weight:500; border-bottom:1px solid var(--border); }
  tbody tr+tr td{ border-top:1px solid var(--border); }
  td.ret.up{ color:var(--up); font-weight:600; } td.ret.down{ color:var(--down); font-weight:600; }
  td.pnl.up{ color:var(--up); font-weight:600; } td.pnl.down{ color:var(--down); font-weight:600; }

  .chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow); }
  .chart-card svg{ display:block; width:100%; height:auto; overflow:visible; }

  footer{ margin:30px 0 24px; font-size:11px; color:var(--ink-faint); line-height:1.6; padding-block-end:env(safe-area-inset-bottom, 0px); }

  /* 오너 로그인 (footer 안, 평소엔 눈에 안 띄게) */
  #ownerAuth{ margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
  #ownerLoginToggle{ font-size:11px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; font-family:inherit; }
  #loginForm{ max-width:280px; margin-top:10px; }
  #loginForm input{ width:100%; padding:9px 11px; margin-bottom:8px; border:1px solid var(--border); border-radius:8px;
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:13px; }
  #loginForm button{ width:100%; padding:10px; border:none; border-radius:8px; background:var(--accent); color:var(--accent-ink);
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  #loginForm button:disabled{ opacity:.6; cursor:default; }
  #loginErr{ color:var(--up); font-size:11.5px; margin-top:6px; min-height:14px; }
  #logoutBtn{ font-size:11px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; font-family:inherit; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>스윙콕핏</h1>
    <div class="asof" id="asofLabel">불러오는 중…</div>
  </div>
  <div class="sub">모의투자 알고리즘이 조건에 맞춰 고른 추천 종목입니다. 투자 조언이 아니며, 실제 매매는 본인 판단과 책임하에 진행하세요.</div>
  <div class="summary" id="ownerSummary" hidden>
    <div class="cell">
      <div class="label">총자산</div>
      <div class="value mono" id="sumEquity">–</div>
    </div>
    <div class="cell">
      <div class="label">누적 손익</div>
      <div class="value mono" id="sumPnl">–</div>
    </div>
    <div class="cell">
      <div class="label">보유 종목</div>
      <div class="value mono" id="sumCount">–</div>
    </div>
  </div>
</header>

<section>
  <div class="section-head">
    <h2>오늘의 추천 종목</h2>
    <span class="badge normal" id="signalsBadge">불러오는 중</span>
  </div>
  <div class="cards" id="signalCards">
    <div class="empty">불러오는 중…</div>
  </div>
</section>

<section>
  <div class="section-head">
    <h2>지난 추천 성과</h2>
    <span class="note">추천가 대비 현재가 기준</span>
  </div>
  <div id="pastWrap"><div class="empty">불러오는 중…</div></div>
</section>

<div id="ownerOnlySections" hidden>
  <section>
    <div class="section-head">
      <h2>보유 종목</h2>
    </div>
    <div id="holdingsWrap"><div class="empty">불러오는 중…</div></div>
  </section>

  <section>
    <div class="section-head">
      <h2>최근 매매</h2>
    </div>
    <div id="tradesWrap"><div class="empty">불러오는 중…</div></div>
  </section>

  <section>
    <div class="section-head">
      <h2>자산 추이</h2>
      <span class="note">실제 모의투자 계좌 스냅샷</span>
    </div>
    <div class="chart-card">
      <svg id="equityChart" viewBox="0 0 640 220" preserveAspectRatio="none" role="img" aria-label="자산 추이 차트"></svg>
      <div class="chart-legend" id="chartLegend" style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:6px"></div>
    </div>
  </section>
</div>

<footer>
  스윙 모멘텀 로직 기반 추천 · 재무 데이터는 DART 공시 기준 · 과거 조건 충족 신호이며 미래 수익을 보장하지 않습니다.

  <div id="ownerAuth">
    <button id="ownerLoginToggle">오너 로그인</button>
    <div id="loginForm" hidden>
      <input type="email" id="email" placeholder="이메일" autocomplete="username">
      <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password">
      <button id="loginBtn">로그인</button>
      <div id="loginErr"></div>
    </div>
    <button id="logoutBtn" hidden>로그아웃</button>
  </div>
</footer>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { fmtWon, fmtPct, buildSignalCard } from "./card.js?v=5";

const SUPABASE_URL = "https://fbgtfxfzkuvdygryszdc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiZ3RmeGZ6a3V2ZHlncnlzemRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTM2MzksImV4cCI6MjEwNTU2OTYzOX0.kgF9dvrDs42qs2GwEK_KOjDpF_x9baMo1qRnvRpdwNw";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// 공개 영역: 오늘의 추천 종목 / 지난 추천 성과 — 로그인 여부와 무관하게 항상 로드
// ============================================================

// 보유중/청산완료 같은 상태는 육지완 님 개인 계좌 정보라 공개 뷰어에는 절대 표시하지 않는다.
function pastRowHTML(sig, idx) {
  const d = sig.details || {};
  const ret = d.latest_return_pct;
  const retClass = ret == null ? "" : (ret >= 0 ? "up" : "down");
  return `
    <tr class="row-clickable" data-idx="${idx}">
      <td>${sig.name}<br><span class="code mono">${sig.ticker}</span></td>
      <td class="mono">${sig.scan_date}</td>
      <td class="mono">${d.price != null ? fmtWon(d.price) : "-"}</td>
      <td class="mono">${d.latest_price != null ? fmtWon(d.latest_price) : "-"}</td>
      <td class="ret ${retClass} mono">${ret != null ? fmtPct(ret) : "-"}</td>
    </tr>
    <tr class="detail-row" data-detail-for="${idx}" hidden><td colspan="5"><div class="detail-inner"></div></td></tr>
  `;
}

function pastTableHTML(rows) {
  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>종목</th><th>추천일</th><th>추천가</th><th>현재가</th><th>수익률</th></tr></thead>
        <tbody>${rows.map((sig, i) => pastRowHTML(sig, i)).join("")}</tbody>
      </table>
    </div>
    <div class="scandate" style="margin-top:6px">행을 탭하면 추천 당시 상세정보(재무·손절가 등)를 볼 수 있습니다.</div>
  `;
}

function wireExpandableRows(container, rows) {
  container.querySelectorAll("tr.row-clickable").forEach(tr => {
    tr.addEventListener("click", () => {
      const idx = tr.dataset.idx;
      const detailRow = container.querySelector(`tr[data-detail-for="${idx}"]`);
      const inner = detailRow.querySelector(".detail-inner");
      const open = !detailRow.hidden;
      if (open) { detailRow.hidden = true; tr.classList.remove("open"); return; }
      if (!inner.dataset.built) {
        inner.appendChild(buildSignalCard(rows[idx], { showReason: false, expandFin: true }));
        inner.dataset.built = "1";
      }
      detailRow.hidden = false;
      tr.classList.add("open");
    });
  });
}

async function loadPublic() {
  const asofEl = document.getElementById("asofLabel");
  const badgeEl = document.getElementById("signalsBadge");
  const cardsEl = document.getElementById("signalCards");
  const pastEl = document.getElementById("pastWrap");

  const { data, error } = await supabase
    .from("signals")
    .select("scan_date,ticker,name,reason,score,details")
    .order("scan_date", { ascending: false })
    .order("score", { ascending: false })
    .limit(100);

  if (error) {
    cardsEl.innerHTML = `<div class="empty">불러오기 실패: ${error.message}</div>`;
    pastEl.innerHTML = "";
    badgeEl.textContent = "오류";
    return;
  }

  const todayStr = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
  asofEl.textContent = todayStr + " 기준";

  if (!data || data.length === 0) {
    cardsEl.innerHTML = `<div class="empty">아직 추천 종목이 없습니다. 다음 스캔을 기다려 주세요.</div>`;
    pastEl.innerHTML = `<div class="empty">아직 데이터가 없습니다.</div>`;
    badgeEl.textContent = "대기중";
    return;
  }

  const latest = data.filter(s => s.scan_date === todayStr);
  const past = data.filter(s => s.scan_date !== todayStr);

  if (latest.length === 0) {
    cardsEl.innerHTML = `<div class="empty">오늘은 조건에 맞는 신규 추천이 없습니다.</div>`;
    badgeEl.textContent = "0건";
  } else {
    badgeEl.textContent = latest.length + "건";
    cardsEl.innerHTML = "";
    latest.forEach(sig => cardsEl.appendChild(buildSignalCard(sig)));
  }

  if (past.length > 0) {
    pastEl.innerHTML = pastTableHTML(past);
    wireExpandableRows(pastEl, past);
  } else {
    pastEl.innerHTML = `<div class="empty">아직 지난 추천 기록이 없습니다.</div>`;
  }
}

// ============================================================
// 오너 전용 영역: 로그인 성공 시에만 로드
// ============================================================

const signalCache = new Map();
async function fetchSignalByTicker(ticker) {
  if (signalCache.has(ticker)) return signalCache.get(ticker);
  const { data } = await supabase
    .from("signals")
    .select("scan_date,ticker,name,reason,score,details")
    .eq("ticker", ticker)
    .order("scan_date", { ascending: false })
    .limit(1);
  const sig = data && data.length ? data[0] : null;
  signalCache.set(ticker, sig);
  return sig;
}

function wireExpandableOwnerRows(container, tickers) {
  container.querySelectorAll("tr.row-clickable").forEach(tr => {
    tr.addEventListener("click", async () => {
      const idx = tr.dataset.idx;
      const detailRow = container.querySelector(`tr[data-detail-for="${idx}"]`);
      const inner = detailRow.querySelector(".detail-inner");
      const open = !detailRow.hidden;
      if (open) { detailRow.hidden = true; tr.classList.remove("open"); return; }
      if (!inner.dataset.built) {
        inner.textContent = "불러오는 중…";
        const sig = await fetchSignalByTicker(tickers[idx]);
        inner.textContent = "";
        if (sig) {
          inner.appendChild(buildSignalCard(sig, { showReason: false, expandFin: true }));
        } else {
          inner.innerHTML = `<div class="empty">이 종목의 추천 당시 정보를 찾을 수 없습니다.</div>`;
        }
        inner.dataset.built = "1";
      }
      detailRow.hidden = false;
      tr.classList.add("open");
    });
  });
}

function drawEquityChart(points) {
  const svg = document.getElementById("equityChart");
  svg.innerHTML = "";
  if (points.length < 2) {
    document.getElementById("chartLegend").textContent = "데이터가 더 쌓이면 추이 그래프가 표시됩니다.";
    return;
  }
  const svgns = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => { const e = document.createElementNS(svgns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const W = 640, H = 220, padL = 54, padR = 10, padT = 14, padB = 10;
  const vals = points.map(p => p.equity);
  const min = Math.min(...vals), max = Math.max(...vals);
  const x = i => padL + (i / (points.length - 1)) * (W - padL - padR);
  const y = v => padT + (1 - ((v - min) / ((max - min) || 1))) * (H - padT - padB);

  [min, max].forEach(v => {
    const gy = y(v);
    svg.appendChild(el("line", { x1: padL, x2: W - padR, y1: gy, y2: gy, stroke: "var(--border)", "stroke-width": 1 }));
    const t = el("text", { x: 4, y: gy + 3, "font-size": 9, fill: "var(--ink-faint)", "font-family": "IBM Plex Mono, monospace" });
    t.textContent = (v / 10000).toFixed(0) + "만";
    svg.appendChild(t);
  });

  let d = "M" + x(0) + "," + y(vals[0]);
  vals.forEach((v, i) => { if (i > 0) d += " L" + x(i) + "," + y(v); });
  const areaD = d + ` L${x(vals.length - 1)},${H - padB} L${x(0)},${H - padB} Z`;
  svg.appendChild(el("path", { d: areaD, fill: "var(--accent-soft)", stroke: "none" }));
  svg.appendChild(el("path", { d, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));

  const lastX = x(vals.length - 1), lastY = y(vals[vals.length - 1]);
  svg.appendChild(el("circle", { cx: lastX, cy: lastY, r: 4, fill: "var(--accent)" }));
  const lt = el("text", { x: lastX, y: lastY - 9, "text-anchor": "end", "font-size": 11, fill: "var(--ink)", "font-family": "IBM Plex Mono, monospace", "font-weight": 600 });
  lt.textContent = fmtWon(vals[vals.length - 1]);
  svg.appendChild(lt);

  const legend = document.getElementById("chartLegend");
  legend.innerHTML = `<span>${points[0].date}</span><span>${points.length}일치 기록</span><span>${points[points.length - 1].date}</span>`;
}

async function bootOwner() {
  document.getElementById("ownerSummary").hidden = false;
  document.getElementById("ownerOnlySections").hidden = false;
  document.getElementById("ownerLoginToggle").hidden = true;
  document.getElementById("loginForm").hidden = true;
  document.getElementById("logoutBtn").hidden = false;

  const [{ data: positions, error: posErr }, { data: trades, error: tradeErr }, { data: snaps, error: snapErr }] = await Promise.all([
    supabase.from("positions").select("*").eq("status", "open").order("entry_date", { ascending: false }),
    supabase.from("trades").select("*").order("exit_date", { ascending: false }).limit(20),
    supabase.from("equity_snapshots").select("*").order("snap_date", { ascending: true }).limit(200),
  ]);

  if (posErr || tradeErr || snapErr) {
    console.error(posErr, tradeErr, snapErr);
    return;
  }

  const latestSnap = snaps && snaps.length ? snaps[snaps.length - 1] : null;
  document.getElementById("sumEquity").textContent = latestSnap ? fmtWon(latestSnap.equity) : "-";
  document.getElementById("sumCount").textContent = (positions ? positions.length : 0) + "개";

  // 누적 손익은 실제 시드자본(1000만원) 대비로 계산 — snaps[0] 기준으로 하면 최근 며칠 변동이
  // "누적 손익"처럼 잘못 보이는 문제가 있었음(2026-09-22 발견/수정).
  const SEED_CAPITAL = 10000000;
  if (latestSnap) {
    const pnl = latestSnap.equity - SEED_CAPITAL;
    const pnlPct = (pnl / SEED_CAPITAL) * 100;
    const pnlEl = document.getElementById("sumPnl");
    pnlEl.textContent = fmtWon(pnl) + " (" + fmtPct(pnlPct) + ")";
    pnlEl.className = "value mono " + (pnl > 0 ? "up" : pnl < 0 ? "down" : "");
  }

  const holdingsWrap = document.getElementById("holdingsWrap");
  if (!positions || positions.length === 0) {
    holdingsWrap.innerHTML = `<div class="empty">보유 중인 종목이 없습니다.</div>`;
  } else {
    const rows = positions.map((p, i) => `
      <tr class="row-clickable" data-idx="${i}">
        <td>${p.name}<br><span class="mono" style="font-size:10.5px;color:var(--ink-faint)">${p.ticker}</span></td>
        <td class="mono">${p.quantity}</td>
        <td class="mono">${fmtWon(p.entry_price)}</td>
        <td class="mono">${p.entry_date}</td>
      </tr>
      <tr class="detail-row" data-detail-for="${i}" hidden><td colspan="4"><div class="detail-inner"></div></td></tr>
    `).join("");
    holdingsWrap.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>종목</th><th>수량</th><th>진입가</th><th>진입일</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="note" style="font-size:10.5px;color:var(--ink-faint);margin-top:6px">행을 탭하면 추천 당시 상세정보를 볼 수 있습니다.</div>`;
    wireExpandableOwnerRows(holdingsWrap, positions.map(p => p.ticker));
  }

  const tradesWrap = document.getElementById("tradesWrap");
  if (!trades || trades.length === 0) {
    tradesWrap.innerHTML = `<div class="empty">아직 청산된 매매가 없습니다.</div>`;
  } else {
    const rows = trades.map((t, i) => {
      const cls = t.pnl_pct > 0 ? "up" : t.pnl_pct < 0 ? "down" : "";
      return `
      <tr class="row-clickable" data-idx="${i}">
        <td>${t.name}<br><span class="mono" style="font-size:10.5px;color:var(--ink-faint)">${t.ticker}</span></td>
        <td class="mono">${t.exit_date}</td>
        <td class="mono">${t.exit_reason || "-"}</td>
        <td class="pnl ${cls} mono">${fmtPct(t.pnl_pct)}</td>
      </tr>
      <tr class="detail-row" data-detail-for="${i}" hidden><td colspan="4"><div class="detail-inner"></div></td></tr>`;
    }).join("");
    tradesWrap.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>종목</th><th>청산일</th><th>사유</th><th>손익률</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="note" style="font-size:10.5px;color:var(--ink-faint);margin-top:6px">행을 탭하면 추천 당시 상세정보를 볼 수 있습니다.</div>`;
    wireExpandableOwnerRows(tradesWrap, trades.map(t => t.ticker));
  }

  drawEquityChart((snaps || []).map(s => ({ date: s.snap_date, equity: s.equity })));
}

// ============================================================
// 로그인 UI 배선
// ============================================================

document.getElementById("ownerLoginToggle").addEventListener("click", () => {
  document.getElementById("loginForm").hidden = false;
  document.getElementById("ownerLoginToggle").hidden = true;
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("loginErr");
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  errEl.textContent = "";
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) {
    errEl.textContent = "로그인 실패: " + error.message;
    return;
  }
  await bootOwner();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  location.reload();
});

// ============================================================
// 부팅: 공개 영역은 항상, 오너 영역은 세션 있을 때만
// ============================================================
loadPublic();

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    await bootOwner();
  }
})();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
